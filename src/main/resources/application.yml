server:
  port: ${PORT}

# Metrics run on their own port so the public app port never serves /actuator.
# Health and Prometheus endpoints allow unauthenticated scrapes.
# MANAGEMENT_PORT must stay reachable only from the Prometheus host.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: word-online-matching
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  r2dbc:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  sql:
    init:
      mode: never

#logging:
#  level:
#    org.springframework:
#      DEBUG

team6515:
  server:
    account:
      url: ${ACCOUNT_SERVER_URL}
  jwt:
    path: ${JWT_FILE_PATH:}

deploy:
  type: ${DEPLOY_TYPE:DEV}

# Bound to CorsProperties. Origins allowed to send credentialed cross-site requests.
# Credentials are on, so this list can never contain "*": the server would then reflect any
# caller's Origin back and let that site read a logged-in member's data.
# html-classic.itch.zone is the address itch.io serves the WebGL build from.
# theevilent.com is the team website, whose account page reads and deletes the member's lobby data.
# Entries are Spring origin patterns, which is what lets the localhost entry cover any dev port.
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:https://theevilent.com,https://arcanecasters.theevilent.com,https://html-classic.itch.zone,http://localhost:[*]}"

# Bound to InternalApiProperties. Guards /api/internal/**, the server-to-server surface.
# Callers present an account-server "server token" as a bearer token; no credential is stored
# here, only which of those tokens count. Empty accepts any server token; set it to an
# authority that exists in the account server to narrow it to the game servers.
internal-api:
  required-authority: ${INTERNAL_API_REQUIRED_AUTHORITY:}

# Bound to MatchTicketProperties.
matching:
  ticket:
    queue-timeout: 5m
    allocation-lease: 30s
    # A QUEUED ticket with no human opponent after this long is matched with a bot near its MMR.
    bot-fallback-after: ${MATCHING_BOT_FALLBACK_AFTER:15s}
    # Applies to terminal tickets only. A MATCHED ticket never expires while its session runs.
    terminal-ttl: 30m
    # MATCHED reconciler. Raise the interval far above a session's lifetime to disable the sweep.
    matched-scan-interval: ${MATCHING_MATCHED_SCAN_INTERVAL:30s}
    # Fast re-check of tickets a client reported but the lobby could not verify yet.
    pending-scan-interval: ${MATCHING_PENDING_SCAN_INTERVAL:3s}
    # A ticket is audited only once it has been MATCHED for at least this long.
    matched-scan-grace: ${MATCHING_MATCHED_SCAN_GRACE:30s}
    matched-scan-batch-size: ${MATCHING_MATCHED_SCAN_BATCH_SIZE:100}
  # Bound to MatchEventStreamProperties.
  events:
    # Keep-alive cadence for the /api/match/events SSE stream. Must stay below the shortest
    # idle timeout of any proxy in front of this service.
    heartbeat-interval: ${MATCHING_EVENTS_HEARTBEAT_INTERVAL:15s}

# Bound to GameServerProperties.
gameserver:
  # How often the lobby re-discovers game servers and re-probes their health.
  refresh-interval: ${GAMESERVER_REFRESH_INTERVAL:15s}
  # Per-server healthcheck timeout. A timeout counts as one failed probe, never an error.
  healthcheck-timeout: ${GAMESERVER_HEALTHCHECK_TIMEOUT:3s}
  # Room list fetch timeout. On timeout the server yields an empty room list.
  sessions-timeout: ${GAMESERVER_SESSIONS_TIMEOUT:3s}
  # Consecutive failed probes before a server stops receiving new sessions.
  # One success restores it immediately.
  failure-threshold: ${GAMESERVER_FAILURE_THRESHOLD:3}

# Administrator playground enabled by default; false removes its routes.
playground:
  enabled: ${PLAYGROUND_ENABLED:true}
  
# Bound to LocalServerProperties. The local server bundle announced by GET /api/offline-pack.
# An empty version announces no bundle (localServer: null); an empty minimum-version means version.
local-server:
  version: ${LOCAL_SERVER_VERSION:0.1.0}
  minimum-version: ${LOCAL_SERVER_MINIMUM_VERSION:}

# Bound to LocalSessionProperties. Matches the desktop client hosts on its own machine.
local-sessions:
  # Turns local matches off without a deploy: the offline pack says so and session issue answers 503.
  enabled: ${LOCAL_SESSIONS_ENABLED:true}

learned-bots:
  config: ${LEARNED_BOT_CONFIG:}

offline-pack:
  # How often the static data of GET /api/offline-pack is rebuilt from the database.
  static-data-refresh-interval: ${OFFLINE_PACK_STATIC_DATA_REFRESH_INTERVAL:5m}

# src/main/resources/application.yml starts with `server.port: ${PORT}` and gives no
# default. PORT is an environment variable in deployment but not in a test run, so the
# placeholder stays as the literal string `${PORT}`, ServerProperties fails to convert it
# to an int, and every test that builds an ApplicationContext dies before it asserts
# anything.
#
# This file does not shadow application.yml - the names differ, so Spring Boot reads both
# and .properties wins on the keys it defines. Everything else in application.yml stays.
#
# The value is irrelevant: @WebFluxTest runs a mock web environment and never binds a
# socket. 0 is the conventional "let the OS pick" value.
server.port=0
